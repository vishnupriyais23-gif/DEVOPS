apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-app-code
data:
  app.py: |
    from flask import Flask
    app = Flask(__name__)

    @app.route('/')
    def home():
        return "Hello from Flask on Kubernetes!"

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=15000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir flask && python /app/app.py
          ports:
            - containerPort: 15000
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: flask-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - port: 15000
      targetPort: 15000
