apiVersion: v1
kind: ConfigMap
metadata:
  name: flashsale-code
data:
  app.py: |
    from flask import Flask, request
    import socket, time, random

    app = Flask(__name__)

    @app.get("/")
    def homepage():
        return {
            "message": "Welcome to Big Sale!",
            "pod": socket.gethostname(),
            "ts": time.time()
        }

    @app.get("/buy")
    def buy():
        item = random.choice(["Smartphone", "Shoes", "Headphones", "Laptop"])
        user = request.args.get("user", f"user{random.randint(1,1000)}")
        return {
            "status": "success",
            "item": item,
            "user": user,
            "served_by_pod": socket.gethostname(),
            "time": time.strftime("%H:%M:%S")
        }

    @app.get("/health")
    def health():
        return {"status": "healthy", "pod": socket.gethostname()}

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=5000)
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: flashsale-rs
  labels:
    app: flashsale
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flashsale
  template:
    metadata:
      labels:
        app: flashsale
    spec:
      containers:
        - name: flashsale-container
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir flask && python /app/app.py
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: app-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: app-code
          configMap:
            name: flashsale-code
---
apiVersion: v1
kind: Service
metadata:
  name: flashsale-svc
spec:
  selector:
    app: flashsale
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: ClusterIP
